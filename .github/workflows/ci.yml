name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  codegen-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install codegen dependencies
        run: npm ci
        working-directory: tools/codegen

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Run codegen
        run: npm run codegen

      - name: Fail if codegen output drifted from committed files
        run: git diff --exit-code -- app/lib/src/events/generated server/src/events/generated

      # Pinned, not tracking stable. Golden tests compare rendered pixels, so a
      # Flutter release that changes text metrics or rasterization breaks every
      # golden with no code change — and it lands on whichever PR happens to be
      # open that day. Bump this deliberately, regenerating goldens in the same
      # commit, so a rendering change is reviewed rather than discovered.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.8

      - name: flutter pub get
        run: flutter pub get
        working-directory: app

      - name: flutter analyze
        run: flutter analyze
        working-directory: app

      # --run-skipped picks up the platform-sensitive goldens, which are
      # skipped by default so a bare local `flutter test` stays green on a
      # Mac. They are generated on Linux by tools/goldens.sh, which is where
      # this job compares them. See app/test/golden_tags.dart.
      - name: flutter test
        run: flutter test --run-skipped
        working-directory: app

      # Golden failures write the master, test and masked-diff images next to
      # the test, and without this they die with the runner — leaving a pixel
      # count to reason backwards from. Keep it after the test step and gated
      # on failure so green runs upload nothing.
      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

      - name: TypeScript type-check generated server types
        run: npm run typecheck
        working-directory: server
