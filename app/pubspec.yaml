name: diamond
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  drift: ^2.23.0
  flutter_riverpod: ^2.6.1
  path: ^1.9.0
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.27
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Both are build-time asset generators, not runtime packages: they write
  # native launcher icons and splash resources into android/ and ios/ and are
  # never linked into the app. So they cost nothing against §12.6's
  # offline-first rule the way `google_fonts` would have.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

  build_runner: ^2.4.13
  drift_dev: ^2.23.0
  very_good_analysis: ^7.0.0
  alchemist: ^0.14.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled, never fetched. Offline-first is the prime directive (§12.6, §19.1,
  # §21.5): a dugout has no signal, and a face that arrives over the network is
  # a blank label on the Saturday it matters. This is also why `google_fonts` is
  # not a dependency — its default behavior is a runtime fetch. Both halves are
  # pinned by `test/ui/theme/typography_test.dart`.
  #
  # Static weights rather than variable: the scale is fixed and asks for exactly
  # these three. The 500 files self-report their family as "... Medium" (Google's
  # legacy naming model); Flutter keys off the `family` and `weight` declared
  # here and ignores the name table, so this grouping is what counts.
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: fonts/SpaceGrotesk-400.ttf
          weight: 400
        - asset: fonts/SpaceGrotesk-500.ttf
          weight: 500
        - asset: fonts/SpaceGrotesk-700.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: fonts/JetBrainsMono-700.ttf
          weight: 700

  # No `assets:` entry for assets/brand/ on purpose. Those PNGs are *inputs*
  # to the two generators below, which read them from disk at build time and
  # write native resources; nothing loads them through the asset bundle at
  # runtime, because the in-app mark is drawn (`DiamondMark`). Declaring them
  # would ship ~30KB of images no code ever reads.

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/icon.png
  android: true
  ios: true
  # iOS rejects an app icon with an alpha channel outright; the source is
  # already opaque, and this is the belt to that suspenders.
  remove_alpha_ios: true
  # Android adaptive icons are two layers the launcher masks together. The
  # foreground carries the mark alone, drawn at 66.7% so it survives the
  # mask's safe zone, and the background is flat Grass.
  adaptive_icon_background: "#2E5E3E"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_foreground.png

# Regenerate with:
#   dart run flutter_native_splash:create
#
# This is the pre-Flutter splash — the frame the OS shows before any Dart runs,
# so it can only be a color and an image. The wordmark, tagline and progress
# track from the design are `SplashScreen`, which renders once Flutter is up.
# Backgrounds follow Turn 03: Raised in light ("raised, not white"), Field in
# dark ("field, no flash") — neither is the page color, so the splash reads as
# a surface rather than as an empty screen.
flutter_native_splash:
  color: "#F4F2EB"
  image: assets/brand/mark_light.png
  color_dark: "#0E1613"
  image_dark: assets/brand/mark_dark.png
  android_12:
    color: "#F4F2EB"
    image: assets/brand/mark_light.png
    color_dark: "#0E1613"
    image_dark: assets/brand/mark_dark.png
